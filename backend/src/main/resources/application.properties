# Smart Rental Tracking System - Backend
# Stage 1: Foundation

spring.application.name=smart-rental-backend

# Server
server.port=8080

# MySQL connection - values come from environment variables.
# Sensible local-dev defaults are provided for host/port/db name.
# DB_USERNAME/DB_PASSWORD have no hardcoded fallback for the password.
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:smart_rental}?createDatabaseIfNotExist=true
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate
# No entities exist yet in Stage 1, so this has no schema effect yet.
# Left as 'none' deliberately - no auto schema generation until entities exist.
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Defer datasource initialization failures so the app (and /api/health)
# can still start even if MySQL is not running yet during Stage 1.
spring.datasource.continue-on-error=true
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.jdbc.DataSourceAutoConfiguration,org.springframework.boot.autoconfigure.orm.jpa.HibernateJpaAutoConfiguration,org.springframework.boot.autoconfigure.jdbc.DataSourceTransactionManagerAutoConfiguration
